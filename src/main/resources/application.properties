# ==============================================================================
# SecureDesk - Configuration principale (Développement)
# ==============================================================================

# ---- Serveur ----
server.port=8080

# ---- DataSource PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/securedesk
spring.datasource.username=securedesk
spring.datasource.password=securedesk
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Initialisation SQL ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Logging ----
logging.level.com.securedesk=DEBUG

# ---- Spring Security - Remember Me ----
securedesk.remember-me.key=CHANGE_ME_IN_PRODUCTION_securedesk_2024

# ---- [V5] Secrets fictifs de laboratoire (Gitleaks) — ne pas utiliser hors labo ----
securedesk.payment.api-key=sk_live_51LabOnlyFakeKeyDoNotUseOutsideLab
github.oauth.token=ghp_labOnlyFakeSecretForGitleaksScanDemo1

# ---- [V7] Actuator entièrement exposé ----
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.health.show-details=always
