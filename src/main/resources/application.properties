# ==============================================================================
# SecureDesk - Configuration principale (Développement)
# ==============================================================================

# ---- Serveur ----
server.port=8080

# ---- DataSource PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/securedesk
spring.datasource.username=securedesk
spring.datasource.password=securedesk
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Initialisation SQL ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Logging ----
logging.level.com.securedesk=DEBUG

# ---- Spring Security - Remember Me ----
securedesk.remember-me.key=CHANGE_ME_IN_PRODUCTION_securedesk_2024
