# ==============================================================================
# SecureDesk - Configuration de test (H2 en mémoire)
# ==============================================================================

# ---- DataSource H2 ----
spring.datasource.url=jdbc:h2:mem:securedesk_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ---- Désactiver l'initialisation SQL en test ----
spring.sql.init.mode=never

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Logging ----
logging.level.com.securedesk=DEBUG
