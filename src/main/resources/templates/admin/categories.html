<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Catégories — SecureDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{fragments/layout :: sidebar}"></div>
<!-- Topbar -->
<div th:replace="~{fragments/layout :: topbar}"></div>
<button class="sd-sidebar-toggle" onclick="toggleSidebar()" id="sidebarToggle"><i class="bi bi-list"></i></button>
<div class="sd-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ======================== CONTENU ======================== -->
<div class="sd-main">
    <div class="sd-content">

        <!-- Page header -->
        <div class="sd-page-header">
            <h1 class="sd-page-title"><i class="bi bi-tags-fill"></i> Gestion des Catégories</h1>
            <p class="sd-page-subtitle">Créez et gérez les catégories de tickets</p>
        </div>

        <!-- Messages flash -->
        <div th:if="${successMessage}" class="sd-alert sd-alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}">Succès</span>
            <button class="sd-alert-dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>
        <div th:if="${errorMessage}" class="sd-alert sd-alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">Erreur</span>
            <button class="sd-alert-dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>

        <!-- Add Category Card -->
        <div class="sd-card mb-24">
            <div class="sd-card-header">
                <span><i class="bi bi-plus-circle"></i> Ajouter une catégorie</span>
            </div>
            <div class="sd-card-body">
                <form th:action="@{/admin/categories}" method="post"
                      style="display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 12px; align-items: end;">
                    <div class="sd-form-group" style="margin-bottom: 0;">
                        <label for="name" class="sd-form-label">Nom</label>
                        <input type="text" id="name" name="name" class="sd-form-control"
                               placeholder="Nom de la catégorie" required>
                    </div>
                    <div class="sd-form-group" style="margin-bottom: 0;">
                        <label for="description" class="sd-form-label">Description</label>
                        <input type="text" id="description" name="description" class="sd-form-control"
                               placeholder="Description (optionnelle)">
                    </div>
                    <button type="submit" class="sd-btn sd-btn-success">
                        <i class="bi bi-plus-lg"></i> Ajouter
                    </button>
                </form>
            </div>
        </div>

        <!-- Categories Table -->
        <div class="sd-card">
            <div class="sd-card-header">
                <span>Catégories existantes</span>
            </div>
            <div class="sd-card-body" style="padding: 0;">
                <div th:if="${categories != null and !categories.isEmpty()}" style="overflow-x: auto;">
                    <table class="sd-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Description</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.id}">1</td>
                                <td>
                                    <span style="display: flex; align-items: center; gap: 8px;">
                                        <i class="bi bi-tag-fill text-primary-c"></i>
                                        <strong th:text="${cat.name}">Catégorie</strong>
                                    </span>
                                </td>
                                <td style="color: var(--text-secondary);"
                                    th:text="${cat.description != null} ? ${cat.description} : '—'">Description</td>
                                <td>
                                    <span th:if="${cat.active}" class="sd-badge sd-badge-active">
                                        <i class="bi bi-check-circle-fill"></i>&nbsp;Active
                                    </span>
                                    <span th:unless="${cat.active}" class="sd-badge sd-badge-inactive">
                                        <i class="bi bi-x-circle-fill"></i>&nbsp;Inactive
                                    </span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}"
                                          method="post" class="inline-form"
                                          onclick="return confirm('Êtes-vous sûr de vouloir désactiver cette catégorie ?');">
                                        <button type="submit" class="sd-btn sd-btn-danger sd-btn-sm">
                                            <i class="bi bi-trash"></i> Supprimer
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Empty state -->
                <div th:if="${categories == null or categories.isEmpty()}" class="sd-empty">
                    <i class="bi bi-tags"></i>
                    <p>Aucune catégorie trouvée. Ajoutez-en une ci-dessus.</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="sd-footer">
            &copy; 2024 SecureDesk &mdash; Projet DevSecOps
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: scripts}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('nav-categories');
        if (el) el.classList.add('active');
    });
</script>
</body>
</html>
