<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'utilisateur — SecureDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{fragments/layout :: sidebar}"></div>
<!-- Topbar -->
<div th:replace="~{fragments/layout :: topbar}"></div>
<button class="sd-sidebar-toggle" onclick="toggleSidebar()" id="sidebarToggle"><i class="bi bi-list"></i></button>
<div class="sd-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ======================== CONTENU ======================== -->
<div class="sd-main">
    <div class="sd-content">

        <div style="max-width: 600px; margin: 0 auto;">

            <!-- Page header -->
            <div class="sd-page-header">
                <h1 class="sd-page-title"><i class="bi bi-pencil-square"></i> Modifier l'utilisateur</h1>
            </div>

            <!-- Message d'erreur -->
            <div th:if="${errorMessage}" class="sd-alert sd-alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}">Erreur</span>
            </div>

            <!-- Form Card -->
            <div class="sd-card">
                <div class="sd-card-body">
                    <form th:action="@{/admin/users/{id}/edit(id=${userToEdit.id})}" method="post">

                        <!-- Nom d'utilisateur -->
                        <div class="sd-form-group">
                            <label for="username" class="sd-form-label">
                                <i class="bi bi-person"></i> Nom d'utilisateur
                            </label>
                            <input type="text" id="username" name="username"
                                   class="sd-form-control" th:value="${userToEdit.username}" required>
                        </div>

                        <!-- Email -->
                        <div class="sd-form-group">
                            <label for="email" class="sd-form-label">
                                <i class="bi bi-envelope"></i> Email
                            </label>
                            <input type="email" id="email" name="email"
                                   class="sd-form-control" th:value="${userToEdit.email}" required>
                        </div>

                        <!-- Nom complet -->
                        <div class="sd-form-group">
                            <label for="fullName" class="sd-form-label">
                                <i class="bi bi-person-vcard"></i> Nom complet
                            </label>
                            <input type="text" id="fullName" name="fullName"
                                   class="sd-form-control" th:value="${userToEdit.fullName}" required>
                        </div>

                        <!-- Rôle -->
                        <div class="sd-form-group">
                            <label for="role" class="sd-form-label">
                                <i class="bi bi-shield"></i> Rôle
                            </label>
                            <select id="role" name="role" class="sd-form-select" required>
                                <option value="ROLE_CLIENT"
                                        th:selected="${userToEdit.role.name() == 'ROLE_CLIENT'}">Client</option>
                                <option value="ROLE_AGENT"
                                        th:selected="${userToEdit.role.name() == 'ROLE_AGENT'}">Agent</option>
                                <option value="ROLE_ADMIN"
                                        th:selected="${userToEdit.role.name() == 'ROLE_ADMIN'}">Admin</option>
                            </select>
                        </div>

                        <!-- Actif -->
                        <div class="sd-form-group">
                            <div class="sd-form-check">
                                <input type="checkbox" id="active" name="active"
                                       th:checked="${userToEdit.active}">
                                <label for="active">Compte actif</label>
                            </div>
                        </div>

                        <!-- Boutons d'action -->
                        <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 28px;">
                            <a th:href="@{/admin/users}" class="sd-btn sd-btn-secondary">
                                <i class="bi bi-arrow-left"></i> Annuler
                            </a>
                            <button type="submit" class="sd-btn sd-btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="sd-footer">
            &copy; 2024 SecureDesk &mdash; Projet DevSecOps
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: scripts}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('nav-users');
        if (el) el.classList.add('active');
    });
</script>
</body>
</html>
