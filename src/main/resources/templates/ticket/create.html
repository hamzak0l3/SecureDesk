<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Ticket — SecureDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Sidebar & Topbar -->
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: topbar}"></div>
<button class="sd-sidebar-toggle" onclick="toggleSidebar()" id="sidebarToggle"><i class="bi bi-list"></i></button>
<div class="sd-sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- ======================== CONTENU ======================== -->
<div class="sd-main">
    <div class="sd-content">

        <div style="max-width: 720px; margin: 0 auto;">
            <!-- Page header -->
            <div class="sd-page-header">
                <h1 class="sd-page-title"><i class="bi bi-plus-circle-fill"></i> Création d'un Ticket de Support</h1>
                <p class="sd-page-subtitle">Détaillez votre incident ou demande d'assistance</p>
            </div>

            <!-- Messages Flash -->
            <div th:if="${errorMessage}" class="sd-alert sd-alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}">Erreur</span>
                <button class="sd-alert-dismiss" onclick="this.parentElement.remove()">&times;</button>
            </div>

            <!-- Form Card -->
            <div class="sd-card">
                <div class="sd-card-header">
                    <span>Informations de la demande</span>
                </div>
                <div class="sd-card-body">
                    <form th:action="@{/tickets/create}" method="post" th:object="${ticketCreateDto}">

                        <!-- Titre -->
                        <div class="sd-form-group">
                            <label for="title" class="sd-form-label">
                                <i class="bi bi-type"></i> Titre de la demande *
                            </label>
                            <input type="text" id="title" th:field="*{title}"
                                   class="sd-form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="Ex: Problème d'accès à la base de données..." required>
                            <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('title')}">
                                <span th:errors="*{title}">Titre invalide</span>
                            </div>
                        </div>

                        <!-- Catégorie et Priorité (Grid 2 colonnes) -->
                        <div class="sd-grid sd-grid-2 mb-20">
                            <!-- Catégorie -->
                            <div class="sd-form-group" style="margin-bottom: 0;">
                                <label for="categoryId" class="sd-form-label">
                                    <i class="bi bi-tags"></i> Catégorie
                                </label>
                                <select id="categoryId" th:field="*{categoryId}" class="sd-form-select">
                                    <option value="">-- Sans catégorie --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}">Catégorie</option>
                                </select>
                            </div>

                            <!-- Priorité -->
                            <div class="sd-form-group" style="margin-bottom: 0;">
                                <label for="priority" class="sd-form-label">
                                    <i class="bi bi-flag"></i> Priorité
                                </label>
                                <select id="priority" th:field="*{priority}" class="sd-form-select" required>
                                    <option th:each="p : ${priorities}"
                                            th:value="${p.name()}"
                                            th:text="${p.displayLabel}">Moyenne</option>
                                </select>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="sd-form-group">
                            <label for="description" class="sd-form-label">
                                <i class="bi bi-text-paragraph"></i> Description détaillée du problème *
                            </label>
                            <textarea id="description" th:field="*{description}"
                                      class="sd-form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      rows="6"
                                      placeholder="Veuillez fournir un maximum de détails (étapes pour reproduire, messages d'erreurs, contexte...)"
                                      required></textarea>
                            <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('description')}">
                                <span th:errors="*{description}">Description invalide</span>
                            </div>
                        </div>

                        <!-- Boutons d'action -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 28px;">
                            <a th:href="@{/tickets}" class="sd-btn sd-btn-secondary">
                                <i class="bi bi-arrow-left"></i> Annuler
                            </a>
                            <button type="submit" class="sd-btn sd-btn-primary sd-btn-lg">
                                <i class="bi bi-check-circle-fill"></i> Soumettre le ticket
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="sd-footer">
            &copy; 2024 SecureDesk &mdash; Projet DevSecOps HelpDesk
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: scripts}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('nav-create');
        if (el) el.classList.add('active');
    });
</script>
</body>
</html>
