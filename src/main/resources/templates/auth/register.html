<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — SecureDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Theme toggle (top-right) -->
<div class="sd-auth-theme-toggle">
    <button class="sd-topbar-btn theme-toggle" onclick="toggleTheme()" title="Changer le thème">
        <i class="bi bi-moon-fill"></i>
        <i class="bi bi-sun-fill"></i>
    </button>
</div>

<div class="sd-auth-page">
    <div class="sd-auth-container" style="max-width: 480px;">
        <div class="sd-auth-card">

            <!-- Logo -->
            <div class="sd-auth-logo">
                <div class="logo-icon"><i class="bi bi-person-plus-fill"></i></div>
                <h2>Créer un compte</h2>
                <p>Rejoignez SecureDesk</p>
            </div>

            <!-- Message d'erreur général -->
            <div th:if="${errorMessage}" class="sd-alert sd-alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}">Erreur</span>
            </div>

            <!-- Formulaire d'inscription -->
            <form th:action="@{/register}" method="post" th:object="${userRegistrationDto}">

                <!-- Nom complet -->
                <div class="sd-form-group">
                    <label for="fullName" class="sd-form-label">
                        <i class="bi bi-person-vcard"></i> Nom complet
                    </label>
                    <input type="text" id="fullName" th:field="*{fullName}"
                           class="sd-form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           placeholder="Jean Dupont" required>
                    <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('fullName')}">
                        <span th:errors="*{fullName}">Erreur</span>
                    </div>
                </div>

                <!-- Nom d'utilisateur -->
                <div class="sd-form-group">
                    <label for="username" class="sd-form-label">
                        <i class="bi bi-person"></i> Nom d'utilisateur
                    </label>
                    <input type="text" id="username" th:field="*{username}"
                           class="sd-form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           placeholder="jean.dupont" required>
                    <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('username')}">
                        <span th:errors="*{username}">Erreur</span>
                    </div>
                </div>

                <!-- Email -->
                <div class="sd-form-group">
                    <label for="email" class="sd-form-label">
                        <i class="bi bi-envelope"></i> Email
                    </label>
                    <input type="email" id="email" th:field="*{email}"
                           class="sd-form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="jean.dupont@exemple.fr" required>
                    <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('email')}">
                        <span th:errors="*{email}">Erreur</span>
                    </div>
                </div>

                <!-- Mot de passe -->
                <div class="sd-form-group">
                    <label for="password" class="sd-form-label">
                        <i class="bi bi-lock"></i> Mot de passe
                    </label>
                    <input type="password" id="password" th:field="*{password}"
                           class="sd-form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="Minimum 8 caractères" required>
                    <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('password')}">
                        <span th:errors="*{password}">Erreur</span>
                    </div>
                </div>

                <!-- Confirmer le mot de passe -->
                <div class="sd-form-group">
                    <label for="confirmPassword" class="sd-form-label">
                        <i class="bi bi-lock-fill"></i> Confirmer le mot de passe
                    </label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           class="sd-form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="Retapez votre mot de passe" required>
                    <div class="sd-invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}">
                        <span th:errors="*{confirmPassword}">Erreur</span>
                    </div>
                </div>

                <button type="submit" class="sd-btn sd-btn-primary sd-btn-block sd-btn-lg">
                    <i class="bi bi-person-check"></i> S'inscrire
                </button>
            </form>

            <div class="sd-auth-footer">
                Déjà un compte ?
                <a th:href="@{/login}">Se connecter</a>
            </div>
        </div>
    </div>
</div>

<!-- Theme script -->
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
