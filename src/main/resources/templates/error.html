<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur — SecureDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Theme toggle -->
<div class="sd-auth-theme-toggle">
    <button class="sd-topbar-btn theme-toggle" onclick="toggleTheme()" title="Changer le thème">
        <i class="bi bi-moon-fill"></i>
        <i class="bi bi-sun-fill"></i>
    </button>
</div>

<div class="sd-auth-page">
    <div class="sd-auth-container" style="max-width: 520px; text-align: center;">
        <div class="sd-auth-card">
            <div style="font-size: 54px; color: var(--danger); margin-bottom: 12px;">
                <i class="bi bi-shield-slash-fill"></i>
            </div>
            <h2 style="color: var(--text-heading); font-size: 24px; font-weight: 700; margin-bottom: 8px;">
                Une erreur est survenue
            </h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">
                L'action demandée n'a pas pu être complétée ou vous n'avez pas les permissions requises.
            </p>

            <div th:if="${message}" class="sd-alert sd-alert-danger" style="text-align: left;">
                <i class="bi bi-exclamation-octagon-fill"></i>
                <span th:text="${message}">Message d'erreur</span>
            </div>

            <p th:if="${status}" style="font-family: monospace; font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">
                Code de statut HTTP : <strong th:text="${status}">500</strong>
            </p>

            <a th:href="@{/dashboard}" class="sd-btn sd-btn-primary sd-btn-lg sd-btn-block">
                <i class="bi bi-house-door-fill"></i> Retour au tableau de bord
            </a>
        </div>
    </div>
</div>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
